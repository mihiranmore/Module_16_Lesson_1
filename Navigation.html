<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar {
            background: #111;
            color: white;
            padding: 20px 8%;
            justify-content: space-around;
            align-items: center;
            display: flex;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
        }

        .logo:hover {
            background: rgb(199, 130, 1);
            color: black;
            transform: translateY(-4px);
        }

        .nav_links{
            display: flex;
            justify-content: space-between;
            gap: 100px;
            text-decoration: none;
            list-style: none;
        }

        .nav_links a {
            background: #111;
            color: white;
            text-decoration: none;
            font-size: 20px;
        }

        .nav_links a:hover{
            color: orange;
            transform: translateY(-2px);
            text-decoration: none;     
        }

        .button {
            padding: 12px 20px;
            border-radius: 6px;
            background: white;
            color: black;
            text-decoration: none;
        }

        .button:hover{
            background: mediumpurple;
            color: white;
            transform: translateY(-4px);
            text-decoration: none;       
        }
    </style>
</head>
<body>
    
    <nav class="navbar">

        <div class="logo">CODINGAL</div>

        <ul class="nav_links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Gallery</a></li>
        </ul>

        <a href="#" class="button">Contact Us</a>
    </nav>
</body>
</html>
